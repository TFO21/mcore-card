<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070B13">
  <title>M Core Oturum Kartı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700;1,800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #070B13; --line: rgba(106, 174, 255, .35); --text: #F2F4F8; --t3: #8C95A3; --blue: #2E8DFF; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: radial-gradient(80% 50% at 50% 0%, #10203C 0%, var(--bg) 70%); color: var(--text); font-family: "Barlow", "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 20px 16px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    header img { height: 28px; width: auto; }
    header span { font-size: 13px; font-weight: 700; letter-spacing: .14em; color: var(--t3); text-transform: uppercase; }
    #app { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
    canvas { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 1200 / 675; border-radius: 14px; box-shadow: 0 10px 40px rgba(0, 0, 0, .6), 0 0 0 1px var(--line); background: #0C1527; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { height: 54px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); color: var(--text); font: 600 17px "Barlow", sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
    button.primary { background: linear-gradient(90deg, #1F57F5, #3A8DFF); border-color: transparent; }
    button svg { width: 20px; height: 20px; }
    p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--t3); }
    .err { padding: 24px; border-radius: 14px; border: 1px dashed var(--line); text-align: center; }
    .err b { display: block; font-size: 18px; color: var(--text); margin-bottom: 6px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; background: #1F57F5; color: #fff; font-weight: 600; font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <header><img src="logo.png" alt="M Core"><span>Oturum kartı</span></header>
    <div id="app"></div>
  </main>
  <script src="card-render.js"></script>
  <script>
    (function () {
      'use strict';
      var app = document.getElementById('app');
      var data = null;
      try { data = window.MCoreCard.unpack(location.hash.slice(1)); } catch (e) { data = null; }
      if (!data) {
        app.innerHTML = '<div class="err"><b>Kart bulunamadı</b><p>Bu sayfa, M Core ekranındaki QR kod okutularak açılır.</p></div>';
        return;
      }
      app.innerHTML = '<canvas id="card" role="img" aria-label="Oturum kartı"></canvas>' +
        '<div class="btns"><button id="save" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Kaydet</button>' +
        '<button id="share" class="primary" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>Paylaş</button></div>' +
        '<p>Kart verisi yalnızca bu bağlantının içinde; hiçbir yere kaydedilmez.' + (data.demo ? ' Bu kart <b>demo verisi</b> içerir.' : '') + '</p>';
      var canvas = document.getElementById('card');
      var opts = { logo: 'logo.png', carSrc: data.car.file ? 'cars/' + data.car.file + '.webp' : null };
      function draw() { window.MCoreCard.draw(canvas, data, opts); }
      draw();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
      var name = 'm-core-' + data.car.id + '-' + data.start.toISOString().slice(0, 10) + '.png';
      function toast(m) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2200); }
      function blob(cb) { canvas.toBlob(cb, 'image/png'); }
      function download(b) { var u = URL.createObjectURL(b), a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 2000); toast('Kart kaydedildi'); }
      document.getElementById('save').onclick = function () { blob(download); };
      document.getElementById('share').onclick = function () {
        blob(function (b) {
          var f = new File([b], name, { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [f] })) navigator.share({ files: [f], title: 'M Core Oturum Kartı' }).catch(function () {});
          else download(b);
        });
      };
    })();
  </script>
</body>
</html>
